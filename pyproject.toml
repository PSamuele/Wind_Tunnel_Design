[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "windtunnel"
version = "0.1.0"
description = "Sizing and steady/transient analysis of open-circuit supersonic blowdown wind tunnels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/PSamuele/Wind_Tunnel_Design"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
windtunnel = "windtunnel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
